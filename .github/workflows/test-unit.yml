name: "Test Unit"

on:
  workflow_call:

jobs:
  test-unit:
    name: "Unit tests with coverage"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.0'
          cache-dependency-path: '**/go.sum'

      - name: Cache task-installed binaries
        uses: actions/cache@v5.0.5
        with:
          path: bin
          key: ${{ runner.os }}-task-bin-${{ hashFiles('Taskfile.yaml') }}
          restore-keys: |
            ${{ runner.os }}-task-bin-

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.50.0

      - name: Run unit tests with coverage
        run: task test:coverage

      - name: Publish coverage to job summary
        if: always()
        run: |
          {
            echo "## 📊 Coverage report"
            echo ""
            echo '```'
            go tool cover -func=coverage/coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Extract total coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COVERAGE=$(go tool cover -func=coverage/coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "COVERAGE=$COVERAGE" >> "$GITHUB_ENV"

      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: e81736479e2a971951273f002df641f4
          filename: spaceship-factory-coverage.json
          label: coverage
          message: ${{ env.COVERAGE }}%
          valColorRange: ${{ env.COVERAGE }}
          minColorRange: 40
          maxColorRange: 90